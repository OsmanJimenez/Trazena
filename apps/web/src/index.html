<!doctype html>
<html lang="es" data-atr-theme="system">
  <head>
    <meta charset="utf-8" />
    <title>Trazena — Base de conocimiento jerárquica</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Trazena: plataforma personal y técnica de gestión del conocimiento y documentación jerárquica en Markdown."
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#191919" />
    <script>
      // GitHub Pages SPA deep-link recovery: restores the path encoded by 404.html
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
  </head>
  <body>
    <trz-root></trz-root>
  </body>
</html>
