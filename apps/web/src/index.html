<!doctype html>
<html lang="es" data-atr-theme="system">
  <head>
    <meta charset="utf-8" />
    <title>Trazena — Base de conocimiento jerárquica</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Trazena: plataforma personal y técnica de gestión del conocimiento y documentación jerárquica en Markdown."
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#191919" />
    <script>
      // PWA self-recovery: if a stale/corrupted Service Worker cache blocks JS chunks after a deploy,
      // clear ONLY ngsw caches & SW registration (never IndexedDB) and reload once.
      (function () {
        var FLAG = 'trz_sw_recovered_v1';
        function recoverOnce() {
          try {
            if (!navigator.onLine || sessionStorage.getItem(FLAG)) return;
            sessionStorage.setItem(FLAG, '1');
            var tasks = [];
            if ('serviceWorker' in navigator) {
              tasks.push(
                navigator.serviceWorker.getRegistrations().then(function (regs) {
                  return Promise.all(regs.map(function (r) { return r.unregister(); }));
                })
              );
            }
            if ('caches' in window) {
              tasks.push(
                caches.keys().then(function (keys) {
                  return Promise.all(
                    keys
                      .filter(function (k) { return k.indexOf('ngsw:') === 0; })
                      .map(function (k) { return caches.delete(k); })
                  );
                })
              );
            }
            Promise.all(tasks).finally(function () {
              window.location.reload();
            });
          } catch (_) {}
        }

        window.addEventListener('error', function (ev) {
          var target = ev && ev.target;
          if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
            recoverOnce();
          }
        }, true);

        window.addEventListener('unhandledrejection', function (ev) {
          var msg = String((ev && ev.reason && (ev.reason.message || ev.reason)) || '');
          if (msg.indexOf('ChunkLoadError') !== -1 || msg.indexOf('Failed to fetch dynamically imported module') !== -1) {
            recoverOnce();
          }
        });

        window.addEventListener('load', function () {
          setTimeout(function () {
            var root = document.querySelector('trz-root');
            if (root && root.children.length === 0 && 'serviceWorker' in navigator && navigator.serviceWorker.controller) {
              recoverOnce();
            }
          }, 7000);
        });
      })();

      // GitHub Pages SPA deep-link recovery: restores the path encoded by 404.html
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
  </head>
  <body>
    <trz-root></trz-root>
  </body>
</html>
