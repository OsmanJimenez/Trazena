name: Deploy Trazena Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prepare production environment file
        env:
          TRAZENA_API_URL: ${{ vars.TRAZENA_API_URL || 'https://api.trazena.osmanjimenez.dev' }}
        run: |
          cat <<EOF > apps/web/src/environments/environment.prod.ts
          export interface AppEnvironment {
            production: boolean;
            apiUrl: string;
          }
          export const environment: AppEnvironment = {
            production: true,
            apiUrl: '${TRAZENA_API_URL}',
          };
          EOF
      - run: npm run build:shared
      - run: npm --workspace=@trazena/web run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist/web/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
